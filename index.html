<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Makarna Kaçış</title>
<style>
:root{--bg:#e8eef3;--fg:#10252c;--card:#f6f9fb;--line:#c9d5dd;--ac:#d9480f;--mut:#4d6a73;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a22;--fg:#e8f4f6;--card:#16303a;--line:#244553;--ac:#ff8a4c;--mut:#8fb0b8}}
:root[data-theme="dark"]{--bg:#0d1a22;--fg:#e8f4f6;--card:#16303a;--line:#244553;--ac:#ff8a4c;--mut:#8fb0b8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*{-webkit-touch-callout:none;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{background:var(--bg);color:var(--fg);font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;overflow:hidden}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
#hud{position:relative;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 14px 6px;font-weight:700;font-size:13px}
#bar{position:relative;flex:1;height:10px;border-radius:6px;background:var(--line);overflow:hidden}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ac);border-radius:6px}
#bm{position:absolute;top:0;bottom:0;width:3px;background:var(--fg);left:0}
#bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.35}
.row{display:flex;gap:6px;padding:0 14px 6px}
.row button{flex:1;padding:7px 2px;border:0;border-radius:10px;background:var(--card);color:var(--fg);font:inherit;font-weight:700;font-size:13px;border:1px solid var(--line)}
.row button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row button:disabled{opacity:.4}
.row button.ic{flex:0 0 40px;padding:7px 0}
#rpl{position:absolute;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;padding:10px 22px;border:0;border-radius:22px;background:#35424d;color:#fff;font:inherit;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#shr{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;padding:12px 28px;border:0;border-radius:24px;background:var(--ac);color:#fff;font:inherit;font-weight:800;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
button{touch-action:manipulation}
.row button{min-width:0}
@media (max-width:370px){.row{gap:4px;padding:0 8px 6px}.row button{font-size:11px;padding:7px 1px}.row button.ic{flex:0 0 30px}#hud{padding:8px 8px 6px;font-size:12px}#chs button{min-width:38px}}
@media (max-height:520px){#chs,#sh,#cb{display:none}#hud{padding:4px 12px}}
.modal{position:fixed;inset:0;background:rgba(5,10,20,.96);display:none;place-items:center;padding:16px;z-index:5;overflow:auto}
.modal.on{display:grid}
.mbox{width:100%;max-width:420px;text-align:center;color:#fff}
.mbox h3{margin:0 0 10px;font-size:22px}
#cimg{-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;max-width:100%;max-height:62vh;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.mrow{display:flex;gap:10px;margin-top:14px}
.mrow button{flex:1;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:800;font-size:15px}
.mrow button.sec{background:#35424d}
.hint{font-size:12px;opacity:.7;margin:8px 0 0}
#cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#cg button{padding:10px 4px;border:2px solid transparent;border-radius:12px;background:#1d2a33;color:#fff;font:inherit;font-size:26px;line-height:1.1}
#cg button small{display:block;font-size:11px;margin-top:4px;opacity:.85}
#cg button.on{border-color:var(--ac)}
#cg button:disabled{opacity:.45}
#chs{overflow-x:auto;flex-wrap:nowrap}#chs::-webkit-scrollbar{display:none}#chs button{flex:0 0 auto;min-width:46px}
#cb{height:6px;margin:0 14px 6px;border-radius:4px;background:var(--line);overflow:hidden;display:none}
#cf{display:block;height:100%;width:0;background:#e8743a}
canvas{flex:1;min-height:0;width:100%;display:block;touch-action:none}
#msg{position:absolute;left:10px;right:10px;top:42%;transform:translateY(-50%);text-align:center;pointer-events:none;padding:22px 8px;background:radial-gradient(ellipse at center,rgba(8,14,24,.42),rgba(8,14,24,0) 74%)}
#msg b{display:block;font-size:30px;line-height:1.15;margin-bottom:8px;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.85),0 2px 10px rgba(0,0,0,.7)}
#msg span{display:block;font-size:15px;line-height:1.45;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.9),0 1px 8px rgba(0,0,0,.75)}
#menuBtn{position:relative;z-index:50;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:17px;font-weight:800;border-radius:10px;padding:0 10px;height:30px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}#menuBtn::before{content:"";position:absolute;inset:-9px;z-index:1}
#home .logo{margin-bottom:14px}#home h1{font-size:32px;margin:4px 0 2px}#home .logo p{margin:0;opacity:.8}
.big{width:100%;padding:16px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:inherit;font-weight:800;font-size:18px;margin-top:10px}.big.sec{background:#35424d}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.hgrid button{padding:14px 6px;border:0;border-radius:12px;background:#1d2a33;color:#fff;font:inherit;font-weight:700;font-size:14px}.hgrid button:disabled{opacity:.45}
.wcard{background:#16222b;border-radius:16px;padding:12px;margin-bottom:12px;text-align:left}.wcard h3{margin:0;font-size:17px}.wcard small{opacity:.7}
.wgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.node{padding:8px 0;border:2px solid transparent;border-radius:12px;background:#223340;color:#fff;font:inherit;font-size:20px;line-height:1.1}.node small{display:block;font-size:9px;opacity:.85;margin-top:2px}
.node.boss{border-color:#ffb300}.node.done{background:#2f5a3a}.node.cur{outline:2px solid #fff}.node:disabled{opacity:.4}
.shc{display:block;width:100%;text-align:left;padding:12px;border:2px solid transparent;border-radius:14px;background:#1d2a33;color:#fff;font:inherit;margin-bottom:8px}.shc span{font-size:26px;margin-right:10px}.shc b{font-size:17px}.shc small{display:block;opacity:.8;margin-top:4px}.shc.on{border-color:var(--ac)}.shc:disabled{opacity:.45}
.tg{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px;border:0;border-radius:12px;background:#1d2a33;color:#fff;font:inherit;font-weight:700;font-size:16px;margin-bottom:8px}.tg b{font-size:13px;opacity:.9}.tg.on b{color:#7cf08a}.tg.danger{background:#3a1f22}
.mbox{max-height:92vh;overflow:auto}
@media (max-width:370px){.wgrid{gap:4px}.node{font-size:17px}}
#adr1,#adr2{position:absolute;left:50%;transform:translateX(-50%);display:none;width:max-content;max-width:92vw;padding:10px 18px;border:0;border-radius:22px;background:#2d6a4f;color:#fff;font:inherit;font-weight:800;font-size:13px;line-height:1.2;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}#adr1{bottom:calc(128px + env(safe-area-inset-bottom,0px))}#adr2{bottom:calc(178px + env(safe-area-inset-bottom,0px))}#adr1:disabled,#adr2:disabled{background:#35424d;opacity:.9}body.adb .modal{padding-bottom:88px}
</style>
</head>
